# AudioExample Plugin Configuration
config_version: 1

# Audio settings
audio:
  # Default volume for audio playback (0-100)
  default_volume: 50
  
  # Audio file format for recordings (wav, mp3, ogg)
  recording_format: wav

# Voice channel settings
voice:
  # Auto join voice channel when user joins
  auto_join: true
  
  # Auto leave when no users in channel
  auto_leave: true

# File paths
paths:
  # Directory for storing audio recordings
  recordings_dir: "recordings/"
  
  # Directory for audio samples
  samples_dir: "samples/"