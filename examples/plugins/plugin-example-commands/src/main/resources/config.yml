# Command Example Plugin Configuration
#
# Every key below is read by the plugin. This file is a reference, so a setting that changes nothing
# would teach the wrong thing: the previous version declared 30 keys of which 12 were read — command
# descriptions that come from lang/*.yml, a text prefix the core owns, a cooldown section replaced by
# CommandBuilder.cooldown(), and permissions that were never registered.
config_version: 1

# Master switch for the whole plugin.
enabled: true

commands:
  ping:
    enabled: true
    # Seconds between two uses, per user. Enforced by the core through
    # CommandBuilder.cooldown() - a plugin never has to track cooldowns itself.
    cooldown: 5

  echo:
    enabled: true
    cooldown: 3
    # Longest text /echo accepts.
    max_length: 500

  info:
    enabled: true
    # Include memory and uptime in the reply.
    show_detailed: true

  admin:
    # The command checks the commandexample.admin permission, which the plugin registers in
    # onPreEnable and declares with CommandBuilder.permission().
    enabled: true

responses:
  # Reply with embeds rather than plain text.
  use_embeds: true

  # Embed colour, as a hex string.
  embed_color: "#5865F2"

debug:
  # Log every command this plugin executes.
  log_command_usage: false
