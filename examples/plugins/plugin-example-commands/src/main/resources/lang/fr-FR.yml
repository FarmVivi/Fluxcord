# Only the strings the plugin actually looks up; the previous version declared 34 keys of
# which 18 were used. Note there is no top-level wrapper: PluginLanguageAdapter already
# namespaces every key by the plugin id, so a 'commandexample:' block here would make
# every lookup miss.

ping:
  description: "Vérifier si le bot répond"
  response: "🏓 Pong ! Le bot est en ligne et réactif."

echo:
  description: "Répéter votre message"
  response: "📢 Vous avez dit : {0}"
  no_message: "Veuillez fournir un message à répéter !"
  too_long: "Message trop long ! Maximum {0} caractères autorisés."

info:
  description: "Afficher les informations du bot et du plugin"
  title: "Plugin d'Exemple de Commandes"
  version: "Version : {0}"
  uptime: "Temps de fonctionnement : {0}"
  commands_executed: "Commandes exécutées : {0}"
  memory_usage: "Utilisation mémoire : {0}MB"

admin:
  description: "Commande administrative (admin seulement)"
  response: "🔧 Commande admin exécutée avec succès !"

status:
  enabled: "✅ Le plugin est activé et prêt !"
  disabled: "🚫 Le plugin est désactivé dans la configuration."
  commands_loaded: "📝 {0} commandes chargées avec succès."
  ready: "🚀 Le système de commandes est prêt !"
