# Music Plugin - French (France) Translations
music:
  # Descriptions des commandes
  command:
    play:
      description: "Jouer de la musique à partir d'une URL ou d'une recherche"
      option:
        query: "URL ou recherche"
        now: "Jouer immédiatement, en sautant la piste actuelle"
    pause:
      description: "Mettre en pause ou reprendre la lecture"
    skip:
      description: "Passer la piste actuelle"
    stop:
      description: "Arrêter la lecture et vider la file d'attente"
    queue:
      description: "Afficher la file d'attente"
      option:
        page: "Numéro de page"
    nowplaying:
      description: "Afficher la piste en cours de lecture"
    volume:
      description: "Ajuster le volume de lecture"
      option:
        level: "Niveau de volume (0-100)"
    loop:
      description: "Contrôler le mode de répétition"
      option:
        mode: "Mode de répétition"
      mode:
        "off": "Désactivé"
        track: "Piste"
        queue: "File d'attente"
    shuffle:
      description: "Activer/désactiver le mode aléatoire"
    clear:
      description: "Vider la file d'attente"
    remove:
      description: "Retirer une piste de la file d'attente"
      option:
        position: "Position de la piste dans la file"
    seek:
      description: "Se déplacer à une position dans la piste actuelle"
      option:
        time: "Temps (ex: 1:30, 90s, 1m30s)"
    playlist:
      description: "Sauvegarder, charger et gérer des playlists nommées"
      option:
        action: "Ce qu'il faut faire avec la playlist"
        name: "Nom de la playlist"
        scope: "Playlist personnelle ou playlist du serveur"
      action:
        save: "sauvegarder la file actuelle"
        load: "charger dans la file"
        list: "lister les playlists"
        show: "afficher les pistes"
        delete: "supprimer"
      scope:
        personal: "personnelle"
        server: "serveur"
  
  # Playlists
  playlist:
    scope:
      personal: "personnelles"
      server: "du serveur"
    saved: "💾 Playlist **{0}** sauvegardée ({1} pistes)"
    replaced: "💾 Playlist **{0}** mise à jour ({1} pistes)"
    deleted: "🗑️ Playlist **{0}** supprimée"
    loaded: "Playlist {0} ajoutée à la file d''attente"
    load_failed: "Aucune piste de **{0}** n''a pu être chargée"
    unavailable: "Indisponibles"
    not_found: "Aucune playlist nommée **{0}**"
    none: "Vous n'avez encore aucune playlist sauvegardée"
    list_title: "{0} playlists {1}"
    list_entry: "• **{0}** - {1} pistes ({2})"
    and_more: "...et {0} de plus"
    nothing_to_save: "Il n'y a rien en lecture à sauvegarder"
    invalid_name: "Un nom de playlist fait au maximum {0} caractères : lettres, chiffres, espaces, - et _"
    too_many: "Vous avez déjà le maximum de {0} playlists, supprimez-en une d''abord"
    too_many_tracks: "Une playlist contient au maximum {0} pistes"
    admin_only: "Seul un administrateur musique peut modifier les playlists du serveur"
    discord_only: "Cette commande doit être utilisée depuis Discord"
    usage: "Usage : playlist <save|load|list|show|delete> [nom] [personal|server]"

  # Messages de succès
  track_added: "Piste ajoutée à la file d'attente"
  playlist_added: "Playlist ajoutée à la file d'attente"
  paused: "⏸️ Lecture mise en pause"
  resumed: "▶️ Lecture reprise"
  skipped: "⏭️ Piste passée : **{0}**"
  stopped: "⏹️ Lecture arrêtée"
  seeked: "⏩ Déplacement à **{0}**"
  
  # Messages de volume
  volume:
    current: "🔊 Volume actuel : **{0}%**"
    set: "🔊 Volume défini à **{0}%**"
  
  # Messages de répétition
  loop:
    disabled: "🔁 Mode répétition désactivé"
    track: "🔂 Répétition de la piste actuelle"
    queue: "🔁 Répétition de la file d'attente"
  
  # Messages du mode aléatoire
  shuffle:
    enabled: "🔀 Mode aléatoire activé"
    disabled: "🔀 Mode aléatoire désactivé"
  
  # Messages de la file d'attente
  queue:
    title: "File d'attente"
    empty: "La file d'attente est vide"
    now_playing: "En cours de lecture"
    upcoming: "Pistes à venir ({0})"
    page: "Page {0} sur {1}"
    duration: "Durée totale"
    modes: "Modes de lecture"
    cleared: "🗑️ **{0}** pistes supprimées de la file d''attente"
    removed: "🗑️ **{0}** retiré de la file d''attente"
  
  # Messages de lecture en cours
  nowplaying:
    title: "En cours de lecture"
    track: "Piste"
    author: "Artiste"
    progress: "Progression"
    duration: "Durée"
    volume: "Volume"
    status: "Statut"
    paused: "En pause"
    live: "Stream en direct"
  
  # Message du lecteur
  player:
    no_track: "Aucune piste en cours"
    paused: "Musique en pause"
    playing: "En cours de lecture"
    track: "Piste"
    progress: "Progression"
    queue: "File d''attente ({0})"
    shuffle_mode: "Mode aléatoire actif"
    more_tracks: "... et {0} de plus"
    loop: "Répéter"
    loop_queue: "Répéter la file"
    shuffle: "Aléatoire"
    modes: "Modes actifs"
  
  # Champs communs
  title: "Titre"
  name: "Nom"
  tracks: "Pistes"
  
  # Messages d'erreur
  error:
    guild_only: "Cette commande ne fonctionne que sur un serveur"
    not_in_voice: "Vous devez être dans un salon vocal pour utiliser cette commande"
    nothing_playing: "Aucune lecture en cours"
    queue_empty: "La file d'attente est vide"
    no_permission: "Vous n'avez pas la permission d'utiliser cette commande"
    no_matches: "Aucun résultat trouvé pour votre recherche"
    load_failed: "Impossible de charger la piste : {0}"
    invalid_position: "Position invalide. Veuillez spécifier un nombre entre {0} et {1}"
    remove_failed: "Impossible de retirer la piste"
    not_seekable: "Cette piste ne supporte pas le déplacement"
    invalid_time: "Format de temps invalide. Utilisez des formats comme : 1:30, 90s, 1m30s"
    seek_too_far: "Impossible de se déplacer au-delà de la durée de la piste"
    wrong_guild: "Ce contrôle est pour un autre serveur"
    unknown_action: "Action inconnue"
    no_providers: "Aucun fournisseur disponible n'est activé dans la configuration"
    modal:
      invalid: "Entrée invalide dans la modale. Veuillez réessayer."
      unexpected: "Une erreur inattendue est survenue. Veuillez réessayer plus tard."

  # Modale d'ajout
  modal:
    title: "Ajouter une piste"
    provider:
      label: "Fournisseur"
      placeholder: "Choisir une source"
    query:
      label: "Recherche ou URL"
      placeholder: "Entrez une recherche ou une URL"
