# Music Plugin - English (US) Translations
music:
  # Command descriptions
  command:
    play:
      description: "Play music from a URL or search query"
      option:
        query: "URL or search query"
        now: "Play immediately, skipping current track"
    pause:
      description: "Pause or resume playback"
    skip:
      description: "Skip the current track"
    stop:
      description: "Stop playback and clear the queue"
    queue:
      description: "Show the music queue"
      option:
        page: "Page number"
    nowplaying:
      description: "Show the currently playing track"
    volume:
      description: "Adjust playback volume"
      option:
        level: "Volume level (0-100)"
    loop:
      description: "Control loop mode"
      option:
        mode: "Loop mode"
      mode:
        off: "Off"
        track: "Track"
        queue: "Queue"
    shuffle:
      description: "Toggle shuffle mode"
    clear:
      description: "Clear the queue"
    remove:
      description: "Remove a track from the queue"
      option:
        position: "Track position in queue"
    seek:
      description: "Seek to a position in the current track"
      option:
        time: "Time (e.g. 1:30, 90s, 1m30s)"
    playlist:
      description: "Save, load and manage named playlists"
      option:
        action: "What to do with the playlist"
        name: "Playlist name"
        scope: "Personal playlist or server playlist"
      action:
        save: "save the current queue"
        load: "load into the queue"
        list: "list playlists"
        show: "show the tracks"
        delete: "delete"
      scope:
        personal: "personal"
        server: "server"
  
  # Playlists
  playlist:
    scope:
      personal: "personal"
      server: "server"
    saved: "💾 Playlist **{0}** saved ({1} tracks)"
    replaced: "💾 Playlist **{0}** updated ({1} tracks)"
    deleted: "🗑️ Playlist **{0}** deleted"
    loaded: "Playlist {0} added to the queue"
    load_failed: "None of the tracks of **{0}** could be loaded"
    unavailable: "Unavailable"
    not_found: "No playlist named **{0}**"
    none: "You have no saved playlist yet"
    list_title: "{0} {1} playlists"
    list_entry: "• **{0}** - {1} tracks ({2})"
    and_more: "...and {0} more"
    nothing_to_save: "There is nothing playing to save"
    invalid_name: "A playlist name must be at most {0} characters, letters, digits, spaces, - and _ only"
    too_many: "You already have the maximum of {0} playlists, delete one first"
    too_many_tracks: "A playlist holds at most {0} tracks"
    admin_only: "Only a music administrator can change the server playlists"
    discord_only: "This command must be used from Discord"
    usage: "Usage: playlist <save|load|list|show|delete> [name] [personal|server]"

  # Success messages
  track_added: "Track Added to Queue"
  playlist_added: "Playlist Added to Queue"
  paused: "⏸️ Playback paused"
  resumed: "▶️ Playback resumed"
  skipped: "⏭️ Skipped: **{0}**"
  stopped: "⏹️ Playback stopped"
  seeked: "⏩ Seeked to **{0}**"
  
  # Volume messages
  volume:
    current: "🔊 Current volume: **{0}%**"
    set: "🔊 Volume set to **{0}%**"
  
  # Loop messages
  loop:
    disabled: "🔁 Loop mode disabled"
    track: "🔂 Looping current track"
    queue: "🔁 Looping queue"
  
  # Shuffle messages
  shuffle:
    enabled: "🔀 Shuffle mode enabled"
    disabled: "🔀 Shuffle mode disabled"
  
  # Queue messages
  queue:
    title: "Music Queue"
    empty: "The queue is empty"
    now_playing: "Now Playing"
    upcoming: "Upcoming Tracks ({0})"
    page: "Page {0} of {1}"
    duration: "Total Duration"
    modes: "Playback Modes"
    cleared: "🗑️ Cleared **{0}** tracks from the queue"
    removed: "🗑️ Removed **{0}** from the queue"
  
  # Now playing messages
  nowplaying:
    title: "Now Playing"
    track: "Track"
    author: "Artist"
    progress: "Progress"
    duration: "Duration"
    volume: "Volume"
    status: "Status"
    paused: "Paused"
    live: "Live Stream"
  
  # Player message
  player:
    no_track: "No Track Playing"
    paused: "Music Paused"
    playing: "Now Playing"
    track: "Track"
    progress: "Progress"
    queue: "Queue ({0})"
    shuffle_mode: "Shuffle Mode Active"
    more_tracks: "... and {0} more"
    loop: "Loop"
    loop_queue: "Loop Queue"
    shuffle: "Shuffle"
    modes: "Active Modes"
  
  # Common fields
  title: "Title"
  name: "Name"
  tracks: "Tracks"
  
  # Error messages
  error:
    not_in_voice: "You must be in a voice channel to use this command"
    nothing_playing: "Nothing is currently playing"
    queue_empty: "The queue is empty"
    no_permission: "You don't have permission to use this command"
    no_matches: "No matches found for your query"
    load_failed: "Failed to load track: {0}"
    invalid_position: "Invalid position. Please specify a number between {0} and {1}"
    remove_failed: "Failed to remove track"
    not_seekable: "This track doesn't support seeking"
    invalid_time: "Invalid time format. Use formats like: 1:30, 90s, 1m30s"
    seek_too_far: "Cannot seek beyond the track duration"
    wrong_guild: "This control is for a different server"
    unknown_action: "Unknown action"
    no_providers: "No available providers are enabled in the configuration"
    modal:
      invalid: "Invalid modal input. Please try again."
      unexpected: "An unexpected error occurred. Please try again later."

  # Add modal strings
  modal:
    title: "Add a track"
    provider:
      label: "Provider"
      placeholder: "Choose a source"
    query:
      label: "Search or URL"
      placeholder: "Enter a search or a URL"