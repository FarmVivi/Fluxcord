commands:
  speak:
    description: "Dire quelque chose à voix haute dans ton salon vocal"
    option:
      text: "Ce que le bot doit dire"
      voice: "Voix à utiliser à la place de celle configurée"
  silence:
    description: "Faire taire le bot et annuler ce qu'il lui restait à dire"
  transcribe:
    description: "Écrire ce qui est dit dans le salon vocal"
    start: "Démarrer"
    stop: "Arrêter"
    option:
      action: "Démarrer ou arrêter la transcription"
  forget:
    description: "Effacer ce que le bot retient des conversations"
    me: "Seulement ce que j'ai dit"
    channel: "Ce salon vocal"
    server: "Tout le serveur"
    option:
      scope: "Ce qu'il faut effacer (ton propre historique par défaut)"

  persona:
    description: "Voir ou ajuster qui est le bot ici"
    show: "Afficher"
    set: "Définir"
    reset: "Réinitialiser"
    option:
      action: "Afficher, définir ou réinitialiser"
      field: "Quelle partie de la personnalité"
      value: "La nouvelle valeur"
      scope: "Ce serveur, ou seulement le salon vocal"
    field:
      name: "Nom"
      traits: "Traits"
      tone: "Ton"
      language: "Langue"
      instructions: "Instructions"
      mood: "Humeur"
    scope:
      server: "Ce serveur"
      channel: "Ce salon vocal"

  converse:
    description: "Laisser le bot répondre à voix haute dans le salon vocal"
    start: "Démarrer"
    stop: "Arrêter"
    option:
      action: "Démarrer ou arrêter les réponses"

