# AI Audio Plugin Configuration
#
# Every key below is read by the plugin. Nothing here is decorative: if a setting is listed, changing
# it changes behaviour. (The previous version of this file documented three times more settings than
# the code ever looked at, and four of the keys it did read did not exist here at all.)
#
# The plugin talks to the AI services over the OpenAI HTTP API, so it does not care who answers.
# Point base_url at OpenAI, at a server on your LAN, or at a service next to the bot in the cluster --
# only the URL changes. Known-compatible self-hosted servers:
#   transcription : Speaches, faster-whisper-server, whisper.cpp (whisper-server), LocalAI
#   speech        : Kokoro-FastAPI, openedai-speech (Piper/Coqui), LocalAI
# A local server usually needs no api_key; leave it empty and no Authorization header is sent.
config_version: 2

# Speech to text: what the bot hears.
speech_to_text:
  # Which HTTP shape the endpoint speaks. This cannot be guessed from the URL.
  #   OPENAI - POST {base_url}/audio/transcriptions with a multipart WAV. OpenAI, Speaches,
  #            whisper.cpp (whisper-server), faster-whisper-server, LocalAI.
  #   OLLAMA - POST {base_url}/api/chat asking a multimodal model to write down what it hears.
  #            Ollama has no transcription route, but a model that accepts audio does the job - and
  #            the same server then covers transcription, reasoning and tool calls in one round trip.
  #            The model must list "audio" in its capabilities (/api/show): Gemma 4 does, Qwen 3.5
  #            does not. With OLLAMA, base_url is the server root, without /v1, and api_key is unused.
  api: OPENAI
  base_url: "${AI_AUDIO_STT_URL:https://api.openai.com/v1}"
  api_key: "${OPENAI_API_KEY:}"
  model: "whisper-1"

  # Expected language, as a BCP 47 tag (fr-FR, en-US). The region is dropped before the request, which
  # wants a bare language code. Use "auto" to let the provider detect it -- slightly slower and less
  # accurate on short sentences.
  language: "auto"

  # Words the transcriber cannot be expected to guess: a bot name, a server's jargon, a nickname, a
  # fandom term. A speech model writes down the nearest word it believes exists, so "Fluxcord" comes
  # back as "flux cord" however clearly it was said, and saying it again does not help.
  #
  # With api: OPENAI the list is sent as Whisper's "prompt" field, which is documented for this. With
  # api: OLLAMA the model is told the words. Both cost context on every request, so keep the list to
  # the names that actually come up -- a few dozen, not a dictionary.
  vocabulary: []

# Text to speech: the bot's own voice.
text_to_speech:
  base_url: "${AI_AUDIO_TTS_URL:https://api.openai.com/v1}"
  api_key: "${OPENAI_API_KEY:}"
  model: "gpt-4o-mini-tts"

  # Voice name, as the provider spells it. OpenAI: alloy, echo, fable, onyx, nova, shimmer.
  # Kokoro: af_heart, af_bella... Piper voices are named after their model file.
  voice: "alloy"

  # Playback volume of the bot's voice (0-100).
  volume: 100

  # Audio priority (0-100). At or above the core's ducking threshold (70 by default), the music plugin
  # is faded down while the bot speaks instead of covering it.
  priority: 80

# How a voice stream is cut into sentences worth transcribing.
transcription:
  # How long a speaker must be quiet before what they said is sent for transcription.
  silence_ms: 1200

  # Longest stretch transcribed in one request, so somebody talking without pause is still transcribed.
  max_segment_seconds: 25

  # Utterances shorter than this are dropped instead of sent: a cough or a keyboard would otherwise
  # cost a request and produce nonsense.
  min_segment_ms: 400

# What the bot remembers of the conversations. Each history is independent and 0 turns it off, so a bot
# can follow a live conversation without keeping any long-term record of the people in it.
memory:
  # Turns kept per voice channel: the conversation in progress.
  channel_turns: 40

  # Turns kept per server, across its channels.
  server_turns: 200

  # Turns kept per person, across every server. This is what lets the AI remember someone who told it
  # something elsewhere; each turn keeps the server and channel it was said in.
  user_turns: 100

# The model that answers out loud. Both OpenAI and Ollama serve POST {base_url}/chat/completions, so unlike
# transcription there is only one shape here - point base_url at whichever runs your model.
#   Ollama: http://your-host:11434/v1 (note the /v1: the OpenAI-compatible route, not /api)
# The model must be fast enough to hold a conversation. Measured on a warmed Ollama, a Gemma 4 E4B answers a
# short sentence in well under a second while a 14B partly on CPU takes eight to ten seconds.
chat:
  base_url: "${AI_AUDIO_CHAT_URL:https://api.openai.com/v1}"
  api_key: "${OPENAI_API_KEY:}"
  model: "gpt-4o-mini"

  # How much the model may wander, in hundredths (70 = 0.7).
  temperature: 70

  # What to ask of a reasoning model. "none" is what makes a spoken conversation possible at all: measured on
  # Ollama 0.34 with Gemma 4 E4B, "none" answers in 0.29 s using 14 tokens, while leaving the model to think
  # burns 376 tokens and five seconds on a block nobody hears - and with a small max_reply_tokens it fills the
  # whole budget thinking and answers with nothing at all.
  # Note that Ollama's own "think: false" does NOT work on this route; only reasoning_effort does.
  # OpenAI's reasoning models also accept low, medium and high. Leave empty to omit the parameter entirely,
  # which a model that rejects it needs.
  reasoning_effort: "none"

  # What to ask on a round where the model is offered tools (see conversation.memory_tools). This is NOT the
  # same value as above: measured on Ollama, with "none" no tool call ever comes back - the model answers "I
  # have no memory of that", invents an answer, or even says out loud that it should call the tool. With "low"
  # both models tested called it, in under two seconds. Empty omits the parameter.
  tool_reasoning_effort: "low"

# Answering out loud. /converse start has to be run in any case; this is the switch that allows it at all.
conversation:
  enabled: false

  # Only sentences containing this are answered. Empty means the bot answers everything said in the channel,
  # which is rarely what you want with more than two people.
  wake_word: ""

  # How many earlier turns of the channel the model is shown. More context costs latency and tokens.
  history_turns: 8

  # Longest answer to ask for. A spoken reply wants a short one, but not a clipped one: at 120 the model
  # ran out of budget mid-thought on anything that needed an explanation, and the symptom was a bot that
  # sounded curt rather than one that had been cut off. Latency grows with the tokens actually produced,
  # so only the answers that are genuinely longer pay for this.
  max_reply_tokens: 220

  # Let the model look the memory up itself, as tool calls, instead of only being handed the last turns
  # above: what was said in this channel, on this server, or by one person across every server. It then
  # asks only when it is missing something, which costs less than a bigger history_turns - but it needs a
  # model that supports tool calls (Gemma 4 and Qwen 3.5 do) and it adds one request per lookup.
  memory_tools: false

  # How many times in a row the model may ask for something before it has to answer. On the last round it
  # is offered no tools, so it answers with what it found rather than being cut off.
  max_tool_rounds: 3

  # The budget for a round that offers tools, which has to be much larger than max_reply_tokens above.
  # Measured: with 120, Gemma 4 E4B spent exactly 120 completion tokens thinking and came back with no tool
  # call and empty content - silence in the voice channel. With 200, exactly 200. Only at 600 did a call
  # appear. The small budget above still applies to the round that only answers, which is what keeps a
  # spoken reply to a sentence or two.
  max_tool_tokens: 600

  # Speech to speech: the model hears the voice and answers with one, instead of reading a transcript and
  # having its text synthesised. What that buys is what a transcript throws away - the hesitation, the
  # laughter, who is shouting - and one less service in the chain.
  #
  # It needs a model that declares an audio modality; a text-only model ignores this at best and refuses the
  # request at worst, which is why both halves are off by default. Today that means OpenAI's audio models
  # (chat.model: "gpt-audio"), or a self-hosted omni model served by vllm-omni. Ollama does not generate
  # audio at all, whatever the model.
  #
  # Transcription keeps running either way: the wake word cannot be matched against samples, and the memory
  # keeps words. What goes away with "speak" is text_to_speech, which /speak still uses on its own.
  audio:
    # Send the recording to the model alongside the transcribed sentence.
    hear: false
    # Ask the model to answer with audio. Only asked for on the round that answers - synthesising a round
    # that ends in a tool call would throw the audio away.
    speak: false
    # The voice for the spoken answer, named as the provider names it.
    voice: "alloy"
    # How the answer comes back: "wav" (self-describing) or "pcm16" (raw, smaller, 24 kHz mono). Those are
    # the two this plugin can decode.
    format: "wav"

  # Full duplex: one WebSocket session instead of a turn at a time. The service hears continuously and
  # decides itself when somebody has finished talking, so the bot can start answering before the sentence
  # ends - and you can cut it off mid-word, which the turn-based path cannot do.
  #
  # Two things to know before switching this on. There is no wake word here: the bot hears everything said
  # in the channel, because turn detection is the service's job and not this plugin's. And the whole path
  # is UNVERIFIED against the real service - the frames are built from the published event names and
  # covered by tests on this side only, so nobody has yet watched it work end to end.
  #
  # Hosted only today: no self-hosted server speaks this protocol. It needs both a url and an api_key, and
  # stays off unless it has them.
  realtime:
    enabled: false
    url: "wss://api.openai.com/v1/realtime?model=gpt-realtime-2.1"
    api_key: ""
    # The provider's voice name for the spoken answer.
    voice: "marin"

# Letting the model look something up on the web, as a tool call, so it can answer what it does not know
# instead of answering last year's facts confidently.
#
# There is NO default instance, on purpose: switching this on has to be the same gesture as deciding where
# the queries go. Point it at an instance you run and nothing a voice channel says leaves your network;
# point it at a public one and every question people ask the bot goes to a stranger's server.
#
# Everything a search returns is treated as hostile input - a title and an extract are written by whoever
# owns the page. Results reach the model fenced, in a tool message that says they are information written
# by strangers and not instructions, and the page itself is never fetched.
web_search:
  enabled: false

  # Which backend's API the instance speaks. SEARXNG for now; this is where another one plugs in.
  api: "SEARXNG"

  # Your instance's root, for example "https://searx.example.lan". Leave it empty and the model is simply
  # never offered the tool, whatever "enabled" says.
  #
  # SearxNG serves HTML only by default and answers 403 to an API call: add "json" under search.formats in
  # its settings.yml, or nothing here will work.
  base_url: ""

  # Only needed when the instance sits behind an authenticating proxy; sent as a bearer token.
  api_key: ""

  # How many results to hand back when the model does not ask for a number. A spoken answer is built from
  # two or three; ten is the hard ceiling.
  max_results: 5

  # Language code to search in ("fr", "en"), or empty to let the instance decide.
  language: ""

  # 0 off, 1 moderate, 2 strict, as SearxNG numbers it.
  safe_search: 1

# Who the bot is. This is the part an operator chooses; the mood below is what the conversation moves.
# A server or a single channel can override any of these at runtime with /persona - an override states only
# what differs, so setting a tone for one channel keeps everything else.
persona:
  name: "Fluxcord"

  # A few adjectives, comma-separated. Beyond eight they stop steering and start diluting.
  traits: ""

  # How it speaks, in your own words (e.g. "familier, concis").
  tone: "neutre"

  # The language it answers in, as a BCP 47 tag.
  language: "fr-FR"

  # Anything that does not fit above. Kept as its own field so it is never confused with a trait.
  instructions: ""

  # The mood drifts with the conversation and fades back to neutral on its own (half-life 20 minutes),
  # per voice channel - the chatter in one channel does not make the bot terse in another.
  mood:
    enabled: true

    # Ask the model how the room actually feels, after each answer, and move the mood towards what it
    # says. Without this the mood is an activity counter wearing an emotion's name: energy only ever went
    # up, one notch per sentence, so the bot grew livelier while being told bad news.
    #
    # It is a small separate request, not a field of the spoken answer - asking for the numbers alongside
    # the reply would make the bot say them out loud as soon as it answers in audio. Measured on a local
    # Ollama over four scenarios: Gemma 4 E4B read the room sensibly 12 times out of 12 in 0.28-0.36 s,
    # Qwen 3.5 9B 9 out of 12. It runs after the answer has been handed to playback, so nobody waits.
    from_model: true

    # How far one reading moves the mood towards it, in hundredths. Half way by default: readings that
    # agree get there quickly while a single odd one does not swing the bot. 100 obeys every reading.
    weight: 50

    # Only used when from_model is off: how much each transcribed sentence raises the energy, in
    # hundredths of the axis. 0 freezes the energy while leaving the rest of the mood in place.
    energy_per_turn: 8

# Request limits.
request:
  # How long to wait for a provider before giving up. A local model on a busy GPU can be slow.
  timeout_seconds: 30

  # Longest text /speak accepts.
  max_text_length: 1000

  # Seconds a user must wait between two /speak calls. 0 disables the cooldown; the core enforces it.
  cooldown_seconds: 5
