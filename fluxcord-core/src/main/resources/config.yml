# Discord Bot Configuration
config_version: 1

discord:
  token: YOUR_BOT_TOKEN

# Language settings
language:
  default: en-US

# Command system settings
commands:
  default-prefix: "!"  # Default prefix for text commands
  cooldown: 3  # Global default cooldown in seconds
  system:
    help: true      # Enable/disable help command
    version: true   # Enable/disable version command
    shutdown: true  # Enable/disable shutdown command
    perm: true      # Enable/disable perm command (user permission overrides)

# Permissions
permissions:
  # Discord user IDs that are operators everywhere: they get every permission whose default is OP
  # (e.g. music volume/admin commands, shutdown). In a server, its owner and members with the
  # ADMINISTRATOR permission are operators of that server automatically.
  operators: []

# Data storage settings
data:
  storage:
    type: FILE  # Options: FILE, DB
    fallback: false  # If true, fall back to file storage when the database is unreachable at startup
    db:
      # Supported drivers: MySQL/MariaDB and PostgreSQL. The dialect is detected from the URL prefix.
      #   MySQL/MariaDB: jdbc:mysql://localhost:3306/fluxcord  or  jdbc:mariadb://localhost:3306/fluxcord
      #   PostgreSQL:    jdbc:postgresql://localhost:5432/fluxcord
      url: "jdbc:mysql://localhost:3306/fluxcord"
      username: username
      password: password
      # Optional prefix for the storage table, so several bots can share the same
      # database/schema without colliding (e.g. "bot1_" -> table "bot1_storage_data").
      # Empty = default table name "storage_data". Allowed chars: letters, digits, underscore.
      table_prefix: ""

  # Binary storage settings for large files
  binary:
    storage:
      type: FILE  # Options: FILE, S3
      fallback: false  # If true, fall back to file binary storage when S3 is unreachable at startup
      file:
        folder: binary
      s3:
        bucket: your-bucket-name
        region: eu-west-3
        access_key: your-access-key
        secret_key: your-secret-key
        endpoint: https://s3.amazonaws.com  # Optional, for S3-compatible services
        prefix: "fluxcord"  # Optional, folder prefix in bucket
        # Use path-style access (endpoint/bucket/key) instead of virtual-host style
        # (bucket.endpoint/key).
        path_style_access: false

# Audio pipeline settings (voice send side)
audio:
  # Duration of the fade-out/fade-in when a high-priority source (e.g. an announcement) starts or stops.
  fade-duration-ms: 200
  # Volume (0-100) the other sources are lowered to while a high-priority source plays.
  # 0 mutes them; 20 (default) keeps the music audible in the background.
  ducking-level: 20
