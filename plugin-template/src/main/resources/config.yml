# Plugin Template Configuration
#
# Every key below is read by the plugin. That matters more here than anywhere else: this file is a
# teaching example, and a setting that changes nothing teaches that settings change nothing. The
# previous version declared 29 keys of which 11 were read — prefixes, cooldowns, limits and an i18n
# section that no line of code ever looked at.
config_version: 1

# Which parts of the template are active. Read in onLoad, so a change needs a plugin reload.
features:
  example_commands: true
  example_events: true
  example_storage: true

  # Answer when someone mentions the bot. Off by default: it is the one feature that talks
  # unprompted, and ExampleEventListener shows the guard rather than the reply.
  respond_to_mentions: false

# The example command (/template).
commands:
  enabled: true

# The JDA listener and the Fluxcord event handler in ExampleEventListener.
events:
  enabled: true

# The three storage scopes shown by ExampleDataService.
storage:
  enabled: true

# Cross-plugin integration, wired in onPostEnable when every other plugin is enabled.
integration:
  # Look for the other plugins this one can cooperate with, and log what was found.
  check_other_plugins: true

# Extra logging while developing the plugin.
debug:
  # Log each message the listener sees.
  log_messages: false

  # Log the Fluxcord plugin lifecycle events this plugin receives.
  log_plugin_events: false
