# Only the strings the plugin actually looks up. A language file is not a catalogue of
# things a plugin might say one day: an unused key is dead weight, and this file is a
# teaching example. The previous version declared 38 keys of which 6 were used.

lifecycle:
  plugin_enabled: "Template Plugin enabled!"
  plugin_disabled: "Template Plugin disabled!"

messages:
  example_message: "Hello from Template Plugin!"
  # Takes an argument, so its apostrophe is doubled: MessageFormat would otherwise swallow {0}.
  mention_response: "Hello {0}! I''m the Template Plugin. Type `/template help` for more information."

commands:
  example: "Execute an example command (demonstration only)"

errors:
  no_permission: "You don't have permission to use this command"
