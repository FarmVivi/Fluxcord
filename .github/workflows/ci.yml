name: CI

# Builds the whole reactor and runs the test suite on every push and pull request.
# The other workflows (docker images, sonar, release) all build with -DskipTests,
# so this is the only place where a broken test shows up.

permissions:
  contents: read

on:
  push:
    branches: [ develop, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      - name: Upload coverage reports (JaCoCo)
        if: success()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
