name: Docker Image CI

permissions:
  contents: read         # pour checkout
  packages: write        # pour push sur GHCR

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0

      # Génération des tags Docker
      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Cache Maven dependencies pour optimiser les builds Docker
      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Connexion à GHCR
      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push de l'image Docker avec optimisations
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.buildkit
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Étape de mise à jour du cache (workaround)
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Déploiement de l'image Docker (optionnel)
      - name: Deploy
        if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
        uses: joelwmale/webhook-action@v2.4.2
        with:
          url: ${{ secrets.DEPLOY_WEBHOOK_URL }}
